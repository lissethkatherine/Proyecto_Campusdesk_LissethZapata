# Desarrollo - PostgreSQL
server.port=${SERVER_PORT:8056}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sistema_gestion_usuarios}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.auto_quote_keyword=true

# Configuración JWT (HMAC256) - Exige JWT_SECRET en entorno (mínimo 32 caracteres)
security.jwt.secret=${JWT_SECRET:}
security.jwt.issuer=${JWT_ISSUER:CampusDesk_API}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Configuración CORS (E5)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5506,http://localhost:5500}

# Configuración Spring Data Redis (Gestión distribuida de sesiones y caché caliente)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=1000ms

# Tiempo de vida de la sesión en Redis (8 horas = 28800 segundos por defecto)
security.session.redis.ttl-seconds=${SESSION_TTL_SECONDS:28800}
