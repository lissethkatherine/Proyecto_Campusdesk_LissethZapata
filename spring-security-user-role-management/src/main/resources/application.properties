# Perfil predeterminado
spring.profiles.active=dev
server.port=${SERVER_PORT:8056}

# Contraseña inicial común para los técnicos creados por el administrador (cada técnico puede cambiarla)
app.technician.default-password=${TECHNICIAN_DEFAULT_PASSWORD:Tecnico2026*}

# Configuración CORS (E5)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5506,http://localhost:5500}

# Configuración Spring Data Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=1000ms
security.session.redis.ttl-seconds=${SESSION_TTL_SECONDS:28800}
